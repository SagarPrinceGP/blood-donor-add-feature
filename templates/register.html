<!DOCTYPE html>
<html>
<head>
<title>Register - Blood Donor</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    background: url("/static/blood_bg.jpg")
                no-repeat center center fixed;

    background-size: 60%;

    font-family: Arial, sans-serif;
}

/* Dark overlay */
.overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:flex-end;
    align-items:center;
}

/* Register Box */
.box{
    width:370px;
    background:rgb(213, 132, 132);

    padding:30px;
    margin-right:80px;

    border-radius:12px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);
}

.box h2{
    text-align:center;
    color:#c0392b;
    margin-bottom:20px;
}

/* Inputs */
.box input{
    width:100%;
    padding:10px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

/* Password rules */
.pass-rule{
    font-size:12px;
    color:#555;
    background:#f2f2f2;

    padding:8px;
    border-radius:5px;
    margin:8px 0;
    text-align:left;
}

/* Button */
.box button{
    width:100%;
    padding:10px;
    margin-top:10px;

    background:#c0392b;
    color:white;

    border:none;
    border-radius:5px;

    font-size:16px;
    cursor:pointer;
}

.box button:hover{
    background:#922b21;
}

/* Links */
.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#c0392b;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}

/* Error */
.error{
    color:red;
    text-align:center;
    font-size:14px;
}

</style>
</head>

<body>

<div class="overlay">

    <div class="box">

        <h2>🩸 Register</h2>

        <form method="POST">

            <input type="text" name="name"
                   placeholder="Enter Name" required>

            <input type="email" name="email"
                   placeholder="Enter Email" required>

            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <div class="pass-rule">
                Password must contain:<br>
                • 8+ characters<br>
                • One Capital Letter<br>
                • One Number<br>
                • One Special Character
            </div>

            <button type="submit">Create Account</button>

        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <div class="links">
            <a href="/login">Already have account? Login</a>
        </div>

    </div>

</div>

</body>
</html>
