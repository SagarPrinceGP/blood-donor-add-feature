<!DOCTYPE html>
<html>
<head>
<title>Blood Donor Entry</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background: url("https://images.unsplash.com/photo-1615461065929-4f8ffed6ca40") no-repeat center center fixed;
    background-size: 100%;

    font-family: Arial;
}

/* Dark overlay for readability */
.overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Form Card */
.card{
    width:400px;
    background: rgba(255,255,255,0.95);

    padding:35px;
    border-radius:15px;

    text-align:center;

    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

/* Heading */
.card h2{
    color:#e74c3c;
    margin-bottom:25px;
}

/* Inputs */
.card input{
    width:100%;
    padding:12px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:8px;

    font-size:14px;
}

/* Button */
.card button{
    width:100%;
    padding:12px;
    margin-top:15px;

    background:#e74c3c;
    color:white;

    border:none;
    border-radius:8px;

    font-size:16px;
    cursor:pointer;
}

.card button:hover{
    background:#c0392b;
}

/* Links */
.links{
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#444;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}

/* Message */
.msg{
    color:green;
    font-weight:bold;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="overlay">
    .overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:center;
    align-items:center;
}

<div class="card">

<h2>🩸 Add Blood Donor</h2>

<form action="/add" method="POST">

<input type="text" name="name" placeholder="Enter Name" required>

<select name="blood" required
        style="width:100%; padding:10px; margin:10px 0;
               border:1px solid #b34545; border-radius:5px;">

    <option value="">-- Select Blood Group --</option>

    <option value="A+">A+</option>
    <option value="A-">A-</option>

    <option value="B+">B+</option>
    <option value="B-">B-</option>

    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>

    <option value="O+">O+</option>
    <option value="O-">O-</option>

</select>

<input type="text" name="phone" placeholder="Phone Number" required>

<input type="text" name="city" placeholder="City" required>

<button type="submit">Add Donor</button>

</form>

{% with messages = get_flashed_messages() %}
{% if messages %}
<p class="msg">{{ messages[0] }}</p>
{% endif %}
{% endwith %}

<div class="links">
<a href="/view">View Donors</a> |
<a href="/logout">Logout</a>
</div>

</div>

</div>

</body>
</html>
