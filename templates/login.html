<!DOCTYPE html>
<html>
<head>
<title>Login - Blood Donor</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:flex-end;   /* RIGHT SIDE */
    align-items:center;

    background: url("/static/login_bg.jpg")
                no-repeat center center fixed;

    background-size: 60%;

    font-family: Arial, sans-serif;
}

/* Dark overlay */
.overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:flex-end;   /* RIGHT SIDE */
    align-items:center;
}

/* Login Box */
.box{
    width:350px;
    background:rgb(248, 243, 243);

    padding:30px;
    margin-right:80px;   /* space from right */

    border-radius:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.box h2{
    text-align:center;
    color:#c0392b;
    margin-bottom:20px;
}

.box input{
    width:100%;
    padding:10px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:5px;
}

.box button{
    width:100%;
    padding:10px;

    background:#c0392b;
    color:white;

    border:none;
    border-radius:5px;

    font-size:16px;
    cursor:pointer;
}

.box button:hover{
    background:#922b21;
}

.links{
    text-align:center;
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#c0392b;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}

.error{
    color:red;
    text-align:center;
    font-size:14px;
}

</style>
</head>

<body>

<div class="overlay">

    <div class="box">

        <h2>🩸 Blood Donor Login</h2>

        <form method="POST">

            <input type="email" name="username"
                   placeholder="Enter Email" required>

            <input type="password" name="password"
                   placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <div class="links">
            <a href="/register">Sign Up</a> |
            <a href="/forgot">Forgot Password?</a>
        </div>

    </div>

</div>

</body>
</html>
