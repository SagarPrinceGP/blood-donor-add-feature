<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - LifePulse Blood Network</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Main Style -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-card">
        
        <div class="auth-header">
            <div class="brand-icon">
                <i class="fa-solid fa-key"></i>
            </div>
            <h2>Password Recovery</h2>
            <p>Enter your registered email address to receive a secure verification OTP.</p>
        </div>

        {% if error %}
        <div class="alert alert-danger" style="margin-bottom: 1.5rem; font-size: 0.88rem;">
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ error }}</span>
            </div>
        </div>
        {% endif %}

        <form action="/forgot" method="POST">
            
            <div class="form-group">
                <label class="form-label" for="email">Registered Email</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem;">
                <i class="fa-solid fa-paper-plane"></i> Send Verification OTP
            </button>

        </form>

        <div class="auth-footer">
            Remembered your credentials? <a href="/login">Back to Sign In</a>
        </div>

    </div>

</body>
</html>
