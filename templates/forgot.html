<!DOCTYPE html>
<html>
<head>
<title>Forgot Password</title>

<style>

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:flex-end;
    align-items:center;

    /* Change image name if needed */
    background: url("/static/forgot_bg.jpg")
                no-repeat center center fixed;

    background-size: 60%;

    font-family: Arial, sans-serif;
}

/* Dark overlay */
.overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:flex-end;
    align-items:center;
}

/* Box */
.box{
    width:350px;
    background:rgb(46, 13, 13);

    padding:30px;
    margin-right:80px;

    border-radius:12px;
    box-shadow:0 0 25px rgba(0,0,0,0.5);

    text-align:center;
}

.box h2{
    color:#c0392b;
    margin-bottom:20px;
}

.box input{
    width:100%;
    padding:10px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:5px;
}

.box button{
    width:100%;
    padding:10px;

    background:#c0392b;
    color:white;

    border:none;
    border-radius:5px;

    font-size:16px;
    cursor:pointer;
}

.box button:hover{
    background:#922b21;
}

.error{
    color:red;
    margin-top:10px;
    font-size:14px;
}

.links{
    margin-top:15px;
}

.links a{
    text-decoration:none;
    color:#c0392b;
    font-size:14px;
}

</style>
</head>

<body>

<div class="overlay">

<div class="box">

<h2>🔐 Forgot Password</h2>

<form method="POST">

<input type="email"
       name="email"
       placeholder="Enter Registered Email"
       required>

<button type="submit">Send OTP</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<div class="links">
<a href="/login">Back to Login</a>
</div>

</div>

</div>

</body>
</html>
