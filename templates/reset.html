<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(to right,#ff512f,#dd2476);
    font-family:Arial;
}

/* Main Box */
.box{
    width:360px;
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;

    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

/* Heading */
.box h2{
    color:#dd2476;
    margin-bottom:20px;
}

/* Inputs */
.box input{
    width:90%;
    padding:12px;
    margin:10px 0;

    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

/* Button */
.box button{
    width:95%;
    padding:12px;
    margin-top:15px;

    background:#dd2476;
    color:white;

    border:none;
    border-radius:6px;

    font-size:16px;
    cursor:pointer;
}

.box button:hover{
    background:#c81e5a;
}

/* Error Message */
.error{
    color:red;
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="box">

<h2>🔒 Reset Password</h2>

<form method="POST">

<input type="password"
       name="new_password"
       placeholder="Enter New Password"
       required>

<input type="password"
       name="confirm_password"
       placeholder="Confirm Password"
       required>

<button type="submit">Reset Password</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
