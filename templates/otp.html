<!DOCTYPE html>
<html>
<head>
<title>Verify OTP</title>

<style>
body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:flex-end;   /* Right side box */
    align-items:center;

    padding-right:80px;

    background: url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3")
                no-repeat center center fixed;

    background-size: cover;

    font-family: Arial;
}
.overlay{
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.6);

    display:flex;
    justify-content:flex-end;
    align-items:center;

    padding-right:80px;
}

/* Left Image */
.left img{
    width:450px;
}

/* Right Box */
.box{
    width:350px;
    background:white;
    padding:30px;
    border-radius:12px;
    text-align:center;

    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

.box h2{
    color:#dd2476;
    margin-bottom:20px;
}

.box input{
    width:90%;
    padding:12px;
    margin:12px 0;

    border:1px solid #ccc;
    border-radius:6px;

    font-size:15px;
    text-align:center;
    letter-spacing:3px;
}

.box button{
    width:95%;
    padding:12px;
    margin-top:15px;

    background:#dd2476;
    color:white;

    border:none;
    border-radius:6px;

    font-size:16px;
    cursor:pointer;
}

.box button:hover{
    background:#c81e5a;
}

.error{
    color:red;
    margin-top:10px;
    font-weight:bold;
}

</style>
</head>

<body>

<!-- LEFT SIDE IMAGE -->
<div class="left">
    <img src="{{ url_for('static', filename='blood.jpg') }}">
 alt="Blood Donation">
</div>

<!-- RIGHT SIDE OTP BOX -->
<div class="box">

<h2>📩 OTP Verification</h2>

<form method="POST">

<input type="text"
       name="otp"
       placeholder="Enter OTP"
       maxlength="6"
       required>

<button type="submit">Verify OTP</button>

</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
